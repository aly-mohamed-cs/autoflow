# Windows installer for Autoflow Studio. The Python engine is bundled first with
#   python deploy/build/bundle_python.py --out build/python-studio   (from the repo root)
appId: com.autoflow.studio
productName: Autoflow Studio
copyright: Autoflow
directories:
  output: ../../build/studio
  buildResources: build
files:
  - out/**
  - package.json
extraResources:
  - from: ../../build/python-studio
    to: engine/python
  - from: build/icon.png
    to: icon.png
asar: true
npmRebuild: false
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png
  artifactName: Autoflow-Studio-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Autoflow Studio
  uninstallDisplayName: Autoflow Studio
  deleteAppDataOnUninstall: false
# latest.yml is generated for in-app updates. The real feed address (the company
# Orchestrator's /downloads/) is set at run time, so this URL is only a placeholder.
publish:
  - provider: generic
    url: https://orchestrator.invalid/downloads/
