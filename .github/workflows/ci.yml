name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Engine (Python)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check src tests
      - run: uv run pytest -q
      - name: Catalog is up to date
        shell: bash
        run: |
          uv run autoflow-engine catalog --out ../packages/flow-types/generated
          git diff --exit-code -- ../packages/flow-types/generated || (echo "::error::Run 'pnpm catalog' and commit the result" && exit 1)
