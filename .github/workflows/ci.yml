name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Engine (Python)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check src tests
      # Desktop tests need a signed-in, unlocked desktop; run them locally or on a robot-like VM.
      - run: uv run pytest -q -m "not desktop"
      - name: Catalog is up to date
        shell: bash
        run: |
          uv run autoflow-engine catalog --out ../packages/flow-types/generated
          git diff --exit-code -- ../packages/flow-types/generated || (echo "::error::Run 'pnpm catalog' and commit the result" && exit 1)

  typescript:
    name: Studio, Orchestrator, dashboard (TypeScript)
    runs-on: windows-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @autoflow/server --filter @autoflow/dashboard build

  integration:
    name: Orchestrator + robot end-to-end
    runs-on: windows-latest
    needs: [engine, typescript]
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @autoflow/server build
      - name: Robot tests (real server + robot + engine, incl. HTTPS and DPAPI)
        working-directory: robot
        run: |
          uv sync --locked
          uv run ruff check src tests
          uv run pytest -q
