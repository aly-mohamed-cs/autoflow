[project]
name = "autoflow-robot"
version = "0.1.0"
description = "Autoflow Robot: runs published automations unattended for the Orchestrator."
requires-python = ">=3.13,<3.14"
dependencies = [
    "autoflow-engine",
    "httpx>=0.28",
    "websockets>=15.0",
]

[project.scripts]
autoflow-robot = "autoflow_robot.cli:main"

[tool.uv.sources]
autoflow-engine = { path = "../engine", editable = true }

[dependency-groups]
dev = ["pytest>=8.4", "ruff>=0.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autoflow_robot"]

[tool.uv]
python-preference = "only-managed"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]
