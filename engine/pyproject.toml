[project]
name = "autoflow-engine"
version = "0.1.0"
description = "Autoflow automation engine: flow interpreter and activity library shared by Studio and Robot."
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic>=2.11",
    "openpyxl>=3.1",
    "playwright>=1.55",
    "pdfplumber>=0.11",
    "pypdf>=5.0",
    "httpx>=0.28",
    "sqlalchemy>=2.0",
    "pyodbc>=5.2",
    "exchangelib>=5.5",
    "uiautomation>=2.0.29 ; sys_platform == 'win32'",
]

[project.scripts]
autoflow-engine = "autoflow_engine.cli:main"

[dependency-groups]
dev = [
    "aiosmtpd>=1.4",
    "pytest>=8.4",
    "ruff>=0.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autoflow_engine"]

[tool.uv]
python-preference = "only-managed"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "browser: drives a real browser (Edge/Chromium) against testbed/portal",
    "desktop: drives the Windows desktop (needs an unlocked interactive session)",
]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]
