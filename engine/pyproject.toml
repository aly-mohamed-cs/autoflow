[project]
name = "autoflow-engine"
version = "0.1.0"
description = "Autoflow automation engine: flow interpreter and activity library shared by Studio and Robot."
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic>=2.11",
    "openpyxl>=3.1",
]

[project.scripts]
autoflow-engine = "autoflow_engine.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autoflow_engine"]

[tool.uv]
python-preference = "only-managed"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]
